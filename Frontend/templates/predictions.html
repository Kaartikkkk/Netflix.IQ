<section class="page" id="page-predictions">
<div class="content">
  <div class="sec-header">
    <div class="sec-title">Predictions <span>Forecast</span></div>
    <div class="sec-sub">Time Series · Genre · Regional · Model Accuracy</div>
  </div>

  <div class="chart-grid grid-2">
    <div class="chart-card">
      <div class="chart-title">Content Forecast</div>
      <div class="chart-sub">Projected new titles (2022–2024)</div>
      <div class="chart-wrap"><canvas id="forecastChart"></canvas></div>
      <div class="insight" id="forecast-insight">Loading forecast...</div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Genre Forecast</div>
      <div class="chart-sub">Top genres — projected growth</div>
      <div class="chart-wrap"><canvas id="genreForecast"></canvas></div>
      <div class="insight" id="genre-insight-pred">Loading genre data...</div>
    </div>
  </div>

  <div class="chart-grid">
    <div class="chart-card chart-full">
      <div class="chart-title">Model Accuracy</div>
      <div class="chart-sub">MAE · RMSE · R² by ML model (XGBoost & LightGBM)</div>
      <div class="chart-wrap"><canvas id="modelAccChart" style="max-height:280px"></canvas></div>
      <div class="insight" id="model-insight">Loading model metrics...</div>
    </div>
  </div>
</div>
</section>
