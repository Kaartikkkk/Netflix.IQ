<section class="page" id="page-business">
<div class="content">
  <div class="sec-header">
    <div class="sec-title">Business <span>Insights</span></div>
    <div class="sec-sub">ROI · Hit/Flop · Investment · Production Frequency</div>
  </div>

  <div class="chart-grid grid-2">
    <div class="chart-card">
      <div class="chart-title">Hit vs Flop Ratio by Genre</div>
      <div class="chart-sub">% of titles rated ≥7.0 (hit) vs &lt;5.5 (flop)</div>
      <button class="dl-btn" onclick="dlChart('hitFlopChart','hit_flop')">↓ PNG</button>
      <div class="chart-wrap"><canvas id="hitFlopChart"></canvas></div>
      <div class="insight" id="hit-flop-insight">Hit vs Flop ratio loading...</div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Production Frequency by Country</div>
      <div class="chart-sub">Annual new titles added per producing nation (2010–2021)</div>
      <button class="dl-btn" onclick="dlChart('prodFreqChart','production_freq')">↓ PNG</button>
      <div class="chart-wrap"><canvas id="prodFreqChart"></canvas></div>
      <div class="insight" id="prod-freq-insight">Production frequency loading...</div>
    </div>
  </div>
</div>
</section>
