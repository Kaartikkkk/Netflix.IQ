<section class="page" id="page-explorer">
<div class="content">
  <div class="sec-header">
    <div class="sec-title">Explorer <span>Interactive</span></div>
    <div class="sec-sub">Filter · Year · Genre · Type · Chart</div>
  </div>

  <div class="explorer-controls">
    <label>Year: <input type="range" id="yearMin" min="2010" max="2021" value="2010" onchange="updateExplorer()"> <span id="yearMinVal">2010</span></label>
    <label>– <input type="range" id="yearMax" min="2010" max="2021" value="2021" onchange="updateExplorer()"> <span id="yearMaxVal">2021</span></label>
    <label>Min Rating: <input type="range" id="minRating" min="0" max="10" step="0.1" value="0" onchange="updateExplorer()"> <span id="minRatingVal">0.0</span></label>
    <label>Genre: <select id="explorerGenre" onchange="updateExplorer()"><option value="all">All</option><option value="Drama">Drama</option><option value="Comedy">Comedy</option><option value="Action">Action</option><option value="Documentary">Documentary</option><option value="Horror">Horror</option></select></label>
    <label>Type: <select id="explorerType" onchange="updateExplorer()"><option value="all">All</option><option value="movie">Movie</option><option value="tv">TV Show</option></select></label>
    <label>Chart: <select id="explorerChartType" onchange="updateExplorer()"><option value="bar">Bar</option><option value="line">Line</option><option value="pie">Pie</option><option value="scatter">Scatter</option></select></label>
    <button onclick="resetExplorer()">Reset</button>
  </div>

  <div class="explorer-stats">
    <div class="e-stat"><span class="e-stat-n" id="eStat1">0</span><div class="e-stat-l">Total Titles</div></div>
    <div class="e-stat"><span class="e-stat-n" id="eStat3">0</span><div class="e-stat-l">Peak Year</div></div>
  </div>

  <div class="chart-grid grid-2">
    <div class="chart-card">
      <div class="chart-title" id="explorerTitle">Content by Year</div>
      <div class="chart-sub" id="explorerSub">Movies & TV Shows · Min rating: 0.0</div>
      <div class="chart-wrap"><canvas id="explorerChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Movies vs TV</div>
      <div class="chart-sub">Distribution for selection</div>
      <div class="chart-wrap"><canvas id="explorerPie"></canvas></div>
    </div>
  </div>

  <div class="chart-grid">
    <div class="chart-card chart-full">
      <div class="chart-title">Rating Histogram</div>
      <div class="chart-sub">Distribution for selection</div>
      <div class="chart-wrap"><canvas id="explorerHist"></canvas></div>
    </div>
  </div>
</div>
</section>
