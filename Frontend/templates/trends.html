<section class="page" id="page-trends">
<div class="content">
  <div class="sec-header">
    <div class="sec-title">Trends <span>Over Time</span></div>
    <div class="sec-sub">Monthly · YoY · Seasonality · Runtime · Rating</div>
  </div>

  <div class="chart-grid">
    <div class="chart-card chart-full">
      <div class="chart-title">YoY Growth</div>
      <div class="chart-sub">Year-over-year % change in catalog additions</div>
      <div class="chart-wrap"><canvas id="yoyChart" style="max-height:280px"></canvas></div>
      <div class="insight" id="yoy-insight">YoY growth loading...</div>
    </div>
  </div>

  <div class="chart-grid">
    <div class="chart-card chart-full">
      <div class="chart-title">Runtime Trend</div>
      <div class="chart-sub">Average runtime by decade</div>
      <div class="chart-wrap"><canvas id="runtimeChart" style="max-height:280px"></canvas></div>
      <div class="insight" id="runtime-insight">Runtime trend loading...</div>
    </div>
  </div>

  <div class="chart-grid">
    <div class="chart-card chart-full">
      <div class="chart-title">Rating Trend</div>
      <div class="chart-sub">Average IMDb rating by decade</div>
      <div class="chart-wrap"><canvas id="ratingTrend" style="max-height:280px"></canvas></div>
      <div class="insight" id="rating-trend-insight">Rating trend loading...</div>
    </div>
  </div>
</div>
</section>
