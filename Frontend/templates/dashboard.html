<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetflixIQ — Professional Analytics Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>

<div class="scanlines"></div>
<!-- NAVIGATION BAR: Always visible -->
<div id="nav-include"></div>


<main class="main">
  <div id="hero-include"></div>
  <div id="intelligence-include" style="display:none"></div>
  <div id="predictions-include" style="display:none"></div>
  <div id="clustering-include" style="display:none"></div>
  <div id="genres-include" style="display:none"></div>
  <div id="geography-include" style="display:none"></div>
  <div id="trends-include" style="display:none"></div>
  <div id="explorer-include" style="display:none"></div>
  <div id="business-include" style="display:none"></div>
  <div id="recommendations-include" style="display:none"></div>
  <div id="advanced-include" style="display:none"></div>
</main>
<script src="/js/analytics_dashboard.js"></script>
<script src="/js/main.js"></script>
<script>

// Robust loader: track when all templates are loaded, only allow navigation/initialization after all are loaded
console.log('NetflixIQ dashboard loader starting...');
var templateList = [
  {id: 'nav-include', path: '/templates/nav.html'},
  {id: 'hero-include', path: '/templates/hero.html'},
  {id: 'intelligence-include', path: '/templates/intelligence.html'},
  {id: 'predictions-include', path: '/templates/predictions.html'},
  {id: 'clustering-include', path: '/templates/clustering.html'},
  {id: 'genres-include', path: '/templates/genres.html'},
  {id: 'geography-include', path: '/templates/geography.html'},
  {id: 'trends-include', path: '/templates/trends.html'},
  {id: 'explorer-include', path: '/templates/explorer.html'},
  {id: 'business-include', path: '/templates/business.html'},
  {id: 'recommendations-include', path: '/templates/recommendations.html'},
  {id: 'advanced-include', path: '/templates/advanced.html'}
];
var templatesLoaded = 0;
function loadTemplate(id, path) {
  fetch(path)
    .then(r => {
      if (!r.ok) throw new Error('Failed to fetch ' + path);
      return r.text();
    })
    .then(html => {
      document.getElementById(id).innerHTML = html;
      templatesLoaded++;
      console.log('Loaded template:', id, '('+templatesLoaded+'/'+templateList.length+')');
      if (templatesLoaded === templateList.length) {
        // All templates loaded, now allow navigation and initialize first page
        window.templatesReady = true;
        console.log('All templates loaded. Initializing dashboard...');
        initAfterTemplates();
      }
    })
    .catch(err => {
      console.error('Error loading template', id, path, err);
      document.getElementById('fallback-message').style.display = 'block';
    });
}
// Load all templates
templateList.forEach(function(t) { loadTemplate(t.id, t.path); });

function initAfterTemplates() {
  // Default to dashboard/hero page
  showPage('dashboard');
  // Attach click handlers to nav-tabs (delegated)
  document.body.addEventListener('click', function(e) {
    var tab = e.target.closest('.nav-tab[data-page]');
    if (tab) {
      var page = tab.getAttribute('data-page');
      showPage(page);
    }
  });
}
</script>
</body>
</html>
